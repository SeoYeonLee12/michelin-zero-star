services:
  #===============================================#
  # 1. Backend Application
  #===============================================#
  backend:
    container_name: michelin-backend
    build:
      context: ./backend/michelin-zero-star
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PROD_APP_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=3306
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - DB_NAME=${PROD_DB_NAME}
      - DB_USER=${PROD_DB_USER}
      - DB_PW=${PROD_DB_PASSWORD}
      - AI_SERVER_URL=http://ai-serving:8000
    networks:
      - mzs-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      ai-serving:
        condition: service_started

  #===============================================#
  # 2. Database (MySQL)
  #===============================================#
  db:
    image: mysql:8.0
    container_name: michelin-db
    restart: always
    ports:
      - "${PROD_DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # ▼ [새로 추가된 초기화 스크립트 연결]
      - ./infra/mysql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PROD_DB_NAME}
      MYSQL_USER: ${PROD_DB_USER}
      MYSQL_PASSWORD: ${PROD_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mzs-network

  #===============================================#
  # 3. Redis
  #===============================================#
  redis:
    image: redis:latest
    container_name: michelin-redis-local
    restart: always
    ports:
      - "6379:6379"
    networks:
      - mzs-network

  #===============================================#
  # 4. AI / Search Engine (Elasticsearch)
  #===============================================#
  elasticsearch:
    build:
      context: .
      dockerfile: infra/elasticsearch/Dockerfile
    container_name: mzs-es
    restart: always
    networks:
      - mzs-network
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data

  #===============================================#
  # 3-1. Elasticsearch Data Loader
  #===============================================#
  # es-data-loader:
  #   build:
  #     context: ./infra/elasticsearch
  #     dockerfile: Dockerfile.loader
  #   container_name: mzs-es-loader
  #   networks:
  #     - mzs-network
  #   environment:
  #     - ELASTICSEARCH_HOST=elasticsearch
  #     - ELASTICSEARCH_PORT=9200
  #     - GMS_KEY=${GMS_KEY}
  #   depends_on:
  #     - elasticsearch
  #   restart: "no"
  
  
  
  #===============================================#
  # 4. Monitoring (Kibana)
  #===============================================#
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: mzs-kibana
    restart: always
    networks:
      - mzs-network
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  #===============================================#
  # 6. AI Serving Server (FastAPI)
  #===============================================#
  ai-serving:
    container_name: mzs-ai
    build:
      context: ./ai-serving
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ES_URL=http://elasticsearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPEECH_KEY=${SPEECH_KEY}
      - SPEECH_REGION=${SPEECH_REGION}
      - PYTHONUNBUFFERED=1
      - PROJECT_NAME="Michelin Zero Star AI"
    volumes:
      - ./ai-serving:/app
    networks:
      - mzs-network
    depends_on:
      - elasticsearch

  #===============================================#
  # 7. Frontend Application (Next.js)
  #===============================================#
  frontend:
    container_name: michelin-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - mzs-network
    depends_on:
      - backend
    command: npm run dev -- -H 0.0.0.0 -p 3000

#===============================================#
# Network & Volume Definition
#===============================================#
networks:
  mzs-network:
    driver: bridge

volumes:
  db_data:
  es_data:
    driver: local