services:
  #===============================================#
  # 1. Backend Application
  #===============================================#
  backend:
    container_name: michelin-backend
    build:
      context: ./backend/michelin-zero-star
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PROD_APP_PORT}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=3306
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - DB_NAME=${PROD_DB_NAME}
      - DB_USER=${PROD_DB_USER}
      - DB_PW=${PROD_DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - AI_SERVER_URL=http://ai-serving:8000

      # [중요] OAuth2 로그인 후 리다이렉트될 프론트엔드 도메인
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-http://localhost:3000}

      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - KAKAO_REST_API_KEY=${KAKAO_REST_API_KEY}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}

      - FILE_UPLOAD_DIR=${FILE_UPLOAD_DIR}

    volumes:
      - ./images:${FILE_UPLOAD_DIR}

    networks:
      - mzs-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_started
      ai-serving:
        condition: service_started

  #===============================================#
  # 2. Database (MySQL)
  #===============================================#
  db:
    image: mysql:8.0
    container_name: michelin-db
    restart: always
    ports:
      - "${PROD_DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./infra/mysql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${PROD_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${PROD_DB_NAME}
      MYSQL_USER: ${PROD_DB_USER}
      MYSQL_PASSWORD: ${PROD_DB_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mzs-network

  #===============================================#
  # 3. Redis
  #===============================================#
  redis:
    image: redis:latest
    container_name: michelin-redis-local
    restart: always
    ports:
      - "6379:6379"
    networks:
      - mzs-network

  #===============================================#
  # 4. AI / Search Engine (Elasticsearch)
  #===============================================#`
  elasticsearch:
    build:
      context: .
      dockerfile: infra/elasticsearch/Dockerfile
    container_name: mzs-es
    restart: always
    networks:
      - mzs-network
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data

  #===============================================#
  # 5. Monitoring (Kibana)
  #===============================================#
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.1
    container_name: mzs-kibana
    restart: always
    networks:
      - mzs-network
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  #===============================================#
  # 6. AI Serving Server (FastAPI)
  #===============================================#
  ai-serving:
    container_name: mzs-ai
    build:
      context: ./ai-serving
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ES_URL=http://elasticsearch:9200
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPEECH_KEY=${SPEECH_KEY}
      - SPEECH_REGION=${SPEECH_REGION}
      - PYTHONUNBUFFERED=1
      - PROJECT_NAME="Michelin Zero Star AI"
    volumes:
      - ./ai-serving:/app
    networks:
      - mzs-network
    depends_on:
      - elasticsearch

  #===============================================#
  # 7. Frontend Application (Next.js)
  #===============================================#
  frontend:
    container_name: michelin-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # [Hybrid Merge] Localhost value with Remote Variable Name
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-https://i14b208.p.ssafy.io/api/v1}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-wss://i14b208.p.ssafy.io/ws-stomp}
    # volumes:  <-- PROD: Keep commented out to use built artifacts
    #   - ./frontend:/app
    #   - /app/node_modules
    #   - /app/.next
    networks:
      - mzs-network
    depends_on:
      - backend
    # command: npm run dev ... <-- PROD: Remove command, use Dockerfile CMD

#===============================================#
# Network & Volume Definition
#===============================================#
networks:
  mzs-network:
    driver: bridge

volumes:
  db_data:
  es_data:
    driver: local
