plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.michelin0'
version = '0.0.1-SNAPSHOT'
description = 'michelin-zero-star'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testRuntimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // [변경] Spring Boot 4.x 호환 최신 버전 (2026.01.01 출시)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'

    // [추가] SpringDoc이 내부적으로 찾는 설정 클래스를 위해 추가
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 구글 로그인 의존성 설정
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    implementation 'io.github.openfeign.querydsl:querydsl-jpa:6.10.1'

    // ⭐ 여기가 제일 중요합니다! 이 3줄을 그대로 복사해 넣으세요. ⭐
    // 1. 뒤에 :jpa 붙인 거 보이시죠? 이게 핵심입니다.
    annotationProcessor "io.github.openfeign.querydsl:querydsl-apt:6.10.1:jpa"

    // 2. QueryDSL이 Jakarta 엔티티를 인식하게 돕는 필수 도구들
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
}

tasks.named('test') {
    useJUnitPlatform()
}
