<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 - Michelin Zero Star</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap"
        rel="stylesheet">
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background-color: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    /* 자체 로그인 폼 */
    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      display: block;
      margin-bottom: 5px;
      font-size: 14px;
      color: #666;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
      box-sizing: border-box; /* 패딩 포함 */
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-login:hover {
      background-color: #555;
    }

    /* 구분선 */
    .divider {
      margin: 25px 0;
      position: relative;
      text-align: center;
    }

    .divider::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 1px;
      background-color: #ddd;
    }

    .divider span {
      background-color: white;
      padding: 0 10px;
      position: relative;
      color: #888;
      font-size: 14px;
    }

    /* 소셜 로그인 버튼 공통 */
    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border: none;
      border-radius: 5px;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: opacity 0.2s;
    }

    .social-btn:hover {
      opacity: 0.9;
    }

    .social-btn i {
      margin-right: 10px;
      font-size: 18px;
    }

    /* 구글 */
    .btn-google {
      background-color: white;
      color: #333;
      border: 1px solid #ddd;
    }

    /* 네이버 (공식 색상) */
    .btn-naver {
      background-color: #03C75A;
      color: white;
    }

    /* 카카오 (공식 색상) */
    .btn-kakao {
      background-color: #FEE500;
      color: #3C1E1E; /* 카카오 갈색 */
    }

  </style>
</head>
<body>

<div class="login-container">
  <h2>로그인</h2>

  <form id="loginForm">
    <div class="input-group">
      <label for="email">이메일</label>
      <input type="email" id="email" placeholder="example@email.com" required>
    </div>
    <div class="input-group">
      <label for="password">비밀번호</label>
      <input type="password" id="password" placeholder="비밀번호 입력" required>
    </div>
    <button type="submit" class="btn-login">이메일로 로그인</button>
  </form>

  <div class="divider">
    <span>또는 소셜 계정으로 로그인</span>
  </div>

  <a href="http://localhost:8080/oauth2/authorization/google" class="social-btn btn-google">
    <i class="fab fa-google"></i> 구글로 시작하기
  </a>

  <a href="http://localhost:8080/oauth2/authorization/naver" class="social-btn btn-naver">
    <i class="fa-solid fa-n"></i> 네이버로 시작하기
  </a>

  <a href="http://localhost:8080/oauth2/authorization/kakao" class="social-btn btn-kakao">
    <i class="fa-solid fa-comment"></i> 카카오로 시작하기
  </a>
</div>

<script>
  // 자체 로그인 처리 로직 (AJAX)
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
      // 백엔드 자체 로그인 API 주소 (예시)
      const response = await fetch('http://localhost:8080/api/v1/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({email, password})
      });

      if (response.ok) {
        const data = await response.json();
        alert("로그인 성공! 토큰: " + data.accessToken);
        console.log(data);
        // 여기서 메인 페이지로 이동하거나 토큰 저장 로직 수행
      } else {
        alert("로그인 실패: 아이디나 비밀번호를 확인해주세요.");
      }
    } catch (error) {
      console.error("에러 발생:", error);
      alert("서버와 통신 중 오류가 발생했습니다.");
    }
  });
</script>
</body>
</html>
