spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USER}
    password: ${DB_PW}

  jpa:
    hibernate:
      ddl-auto: validate

    # 운영 로그가 지저분해지는 것을 막기 위해 SQL 출력 끔
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false

# 로그 레벨 설정
logging:
  level:
    root: INFO # 경고, 중요 정보만 기록할 것임
    com.michelin0.michelinzerostar: INFO
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql: OFF

ai-server:
  url: http://localhost:8000